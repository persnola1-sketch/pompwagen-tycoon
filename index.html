<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a2130" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" />
  <title>Pompwagen Tycoon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden; position: fixed;
      background: #1a2130; touch-action: none; overscroll-behavior: none;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    #app { width: 100%; height: 100%; }
    canvas { display: block; }
    #loading {
      position: fixed; inset: 0; background: #1a2130; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #e8eaf0; transition: opacity 0.4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .logo { font-size: 30px; font-weight: 800; letter-spacing: 1px; font-family: 'Baloo 2', 'Nunito', sans-serif; }
    #loading .logo span { color: #ffb020; }
    #loading .bar { width: 180px; height: 6px; background: #2c3548; border-radius: 3px; margin-top: 18px; overflow: hidden; }
    #loading .bar i { display: block; height: 100%; width: 40%; background: #ffb020; border-radius: 3px; animation: slide 1s infinite ease-in-out; }
    @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(450%);} }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">
    <div class="logo">POMPWAGEN <span>TYCOON</span></div>
    <div class="bar"><i></i></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
